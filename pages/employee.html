<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الموظف والمندوب الميداني — منصة كسوة</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="brand-logo">
        <span class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 3a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V8l7 4.5a1.5 1.5 0 0 1-.8 2.75H4.8a1.5 1.5 0 0 1-.8-2.75L11 8V6.73A2 2 0 0 1 12 3Z"></path>
          </svg>
        </span>
        <span>كسوة — العمليات الميدانية</span>
      </a>

      <div class="nav-actions">
        <a href="../index.html" class="btn-secondary">الموقع الرئيسي</a>
        <button type="button" data-logout-btn="" class="btn-primary">تسجيل الخروج</button>
      </div>
    </div>
  </header>

  <section class="dash-header-banner">
    <div class="container dash-welcome-row">
      <div>
        <span class="eyebrow-pill" style="margin-bottom:8px;">بوابة الموظف والمستلم الميداني</span>
        <h1 id="emp-user-name" style="font-size:26px; font-weight:700;">جاري التحميل...</h1>
        <p id="emp-user-email" style="font-size:14px; color:var(--text-muted);"></p>
      </div>
      <div>
        <span class="badge-status" style="background:var(--green-dark); color:var(--white);">متصل بغرفة العمليات</span>
      </div>
    </div>
  </section>

  <main class="container">
    <div class="dash-kpi-grid">
      <div class="kpi-card">
        <span>طلبات بانتظار الاستلام</span>
        <strong id="emp-kpi-pending">0</strong>
      </div>
      <div class="kpi-card">
        <span>طلبات تم فحصها بواسطتي</span>
        <strong id="emp-kpi-my-verified">0</strong>
      </div>
      <div class="kpi-card">
        <span>إجمالي القطع المستلمة فعلياً</span>
        <strong id="emp-kpi-actual-pieces">0 قطعة</strong>
      </div>
      <div class="kpi-card">
        <span>إجمالي المهام على المنصة</span>
        <strong id="emp-kpi-total">0</strong>
      </div>
    </div>

    <div class="dash-main-grid">
      <!-- نموذج الفحص الميداني واعتماد الاستلام -->
      <section class="dash-panel">
        <div class="dash-panel-head">
          <h2 style="font-size:18px; font-weight:700;">نموذج الفحص واعتماد الاستلام</h2>
          <span class="badge-status">توثيق إلزامي</span>
        </div>

        <form id="employee-inspection-form">
          <div class="form-group">
            <label class="form-label" for="emp-select-donation">اختر طلب التبرع الجاري استلامه</label>
            <div class="input-capsule">
              <select id="emp-select-donation" required></select>
            </div>
          </div>

          <!-- ملخص تفاصيل الطلب المختار للموظف -->
          <div id="emp-selected-order-preview" style="background:var(--bg-sand); border-radius:var(--radius-sm); padding:14px; margin-bottom:16px; font-size:13px;"></div>

          <div class="form-group">
            <label class="form-label" for="emp-order-status">تحديث حالة الطلب</label>
            <div class="input-capsule">
              <select id="emp-order-status" required>
                <option value="تم الاستلام والفحص">تم الاستلام والفحص بنجاح</option>
                <option value="جاري الاستلام من المتبرع">جاري الاستلام من المتبرع</option>
                <option value="تم التسليم للجمعية">تم التسليم لمخزن الجمعية</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="emp-actual-pieces">العدد الفعلي للقطع بعد الفرز</label>
            <div class="input-capsule">
              <input type="number" id="emp-actual-pieces" min="1" required placeholder="أدخل العدد الفعلي المستلم">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="emp-inspection-photos">صور القطع المستلمة (توثيق ميداني)</label>
            <div class="input-capsule">
              <input type="file" id="emp-inspection-photos" accept="image/*" multiple required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="emp-notes">تقرير الفحص وحالة الملابس</label>
            <div class="input-capsule">
              <input type="text" id="emp-notes" placeholder="مثال: تم فرز القطع، جميعها نظيفة ومطابقة للمواصفات">
            </div>
          </div>

          <button type="submit" id="emp-submit-btn" class="btn-primary btn-full">اعتماد الاستلام وحفظ الصور</button>
        </form>
      </section>

      <!-- قائمة مهام الاستلام الميدانية -->
      <section class="dash-panel">
        <div class="dash-panel-head" style="flex-wrap:wrap; gap:10px;">
          <h2 style="font-size:18px; font-weight:700;">قائمة مهام الاستلام الميدانية</h2>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn-secondary emp-filter-btn active" data-emp-filter="pending" style="height:34px; padding:0 14px; font-size:12px;">بانتظار الاستلام</button>
            <button type="button" class="btn-secondary emp-filter-btn" data-emp-filter="verified" style="height:34px; padding:0 14px; font-size:12px;">تم الفحص</button>
            <button type="button" class="btn-secondary emp-filter-btn" data-emp-filter="all" style="height:34px; padding:0 14px; font-size:12px;">الكل</button>
          </div>
        </div>

        <div class="form-group">
          <div class="input-capsule">
            <input type="text" id="emp-search-input" placeholder="بحث باسم المتبرع، الحي/العنوان، أو رقم الهاتف...">
          </div>
        </div>

        <div id="emp-tasks-list" class="donation-list"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/kiswah-core.js"></script>
  <script src="../js/employee.js"></script>
</body>
</html>
