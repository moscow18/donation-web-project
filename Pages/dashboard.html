<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — منصة كسوة</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard-layout">

  <div id="dashboard-root">
    <header class="navbar">
      <div class="container navbar-inner">
        <a href="index.html" class="brand-logo">
          <span class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 3a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V8l7 4.5a1.5 1.5 0 0 1-.8 2.75H4.8a1.5 1.5 0 0 1-.8-2.75L11 8V6.73A2 2 0 0 1 12 3Z"/>
            </svg>
          </span>
          <span>كسوة</span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn-secondary">الصفحة الرئيسية</a>
          <button type="button" data-logout-btn class="btn-primary">تسجيل الخروج</button>
        </div>
      </div>
    </header>

    <section class="dash-header-banner">
      <div class="container dash-welcome-row">
        <div>
          <span class="booking-step-tag" style="margin-bottom: 8px; display: inline-block;">لوحة متابعة المتبرع</span>
          <h1 id="dash-user-name" style="font-size: 26px; font-weight: 700;">جاري تحميل البيانات...</h1>
          <p id="dash-user-email" style="font-size: 14px; color: var(--text-muted);"></p>
        </div>
        <div class="status-pill">
          <span class="status-dot"></span>
        </div>
      </div>
    </section>

    <main class="container">
      <div class="dash-kpi-grid">
        <div class="kpi-card">
          <span>إجمالي طلبات التبرع</span>
          <strong id="kpi-total-orders">0</strong>
        </div>
        <div class="kpi-card">
          <span>إجمالي القطع المقدرة</span>
          <strong id="kpi-total-pieces">0</strong>
        </div>
        <div class="kpi-card">
          <span>طلبات قيد التنفيذ</span>
          <strong id="kpi-active-orders">0</strong>
        </div>
        <div class="kpi-card">
          <span>طلبات مكتملة التسليم</span>
          <strong id="kpi-done-orders">0</strong>
        </div>
      </div>

      <div class="dash-main-grid">
        <section class="dash-panel">
          <div class="dash-panel-head">
            <h2 style="font-size: 18px; font-weight: 700;">تسجيل طلب استلام جديد</h2>
            <span class="booking-step-tag">مجاني</span>
          </div>

          <div class="segmented-control">
            <button type="button" class="segment-btn active" data-pickup-mode="استلام من المنزل">استلام من المنزل</button>
            <button type="button" class="segment-btn" data-pickup-mode="أقرب نقطة تجميع">أقرب نقطة تجميع</button>
          </div>

          <form id="dash-booking-form">
            <div class="form-group">
              <div class="form-label-row">
                <label class="form-label" for="pickup-campaign">المبادرة المستهدفة</label>
              </div>
              <div class="input-capsule">
                <select id="pickup-campaign">
                  <option value="تبرع عام للأسر المستحقة">تبرع عام للأسر المستحقة</option>
                  <option value="مبادرة شتاء دافئ لقرى الصعيد">مبادرة شتاء دافئ لقرى الصعيد</option>
                  <option value="مبادرة جاهز للمدرسة للأيتام">مبادرة جاهز للمدرسة للأيتام</option>
                  <option value="إعادة التدوير وصغار الحرفيين">إعادة التدوير وصغار الحرفيين</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <div class="form-label-row">
                <label class="form-label" for="pickup-address">عنوان الاستلام</label>
              </div>
              <div class="input-capsule">
                <input type="text" id="pickup-address" placeholder="المدينة، الحي، اسم الشارع ورقم العقار" required>
              </div>
            </div>

            <div class="form-group">
              <div class="form-label-row">
                <label class="form-label">تقدير الكمية</label>
              </div>
              <div class="size-pills">
                <button type="button" class="size-pill-btn active" data-pieces="12">1 - 2 حقيبة</button>
                <button type="button" class="size-pill-btn" data-pieces="30">3 - 5 حقائب</button>
                <button type="button" class="size-pill-btn" data-pieces="60">كمية كبيرة</button>
              </div>
            </div>

            <div class="form-group">
              <div class="form-label-row">
                <label class="form-label" for="pickup-phone">رقم الهاتف للتواصل</label>
              </div>
              <div class="input-capsule">
                <span class="phone-prefix">+20</span>
                <input type="tel" id="pickup-phone" placeholder="10X XXX XXXX" required>
              </div>
            </div>

            <div class="form-group">
              <div class="form-label-row">
                <label class="form-label" for="pickup-date">تاريخ الاستلام</label>
              </div>
              <div class="input-capsule">
                <input type="date" id="pickup-date" required>
              </div>
            </div>

            <button type="submit" class="btn-primary btn-full">إرسال طلب التبرع</button>
          </form>
        </section>

        <section class="dash-panel">
          <div class="dash-panel-head">
            <h2 style="font-size: 18px; font-weight: 700;">سجل تبرعاتك وطلبات الاستلام</h2>
            <span style="font-size: 12px; color: var(--text-muted);">محدّث تلقائياً</span>
          </div>

          <div id="dash-donations-list" class="donation-list">
            <div class="empty-state-box">جاري تحميل سجل التبرعات من قاعدة البيانات...</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/app.js"></script>
</body>
</html>
